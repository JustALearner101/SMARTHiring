name: Main CI/CD & Production Integration Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-integration-tests:
    name: Backend Integration Tests & Migration Gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/postgres"
      LANGGRAPH_CHECKPOINT_DB_URI: "postgresql://postgres:postgres@localhost:5432/postgres"
      ENVIRONMENT: "test"
      DEBUG: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Run Ruff Linter
        run: uv run ruff check .

      - name: Run Bandit SAST Security Scan
        run: uv run bandit -r app/ -ll -ii

      - name: Run pip-audit Vulnerability Scan
        run: uv run pip-audit --ignore-vuln CVE-2026-114603

      - name: Verify PostgreSQL Connection & pgvector Extension
        run: uv run python -m scripts.check_db

      - name: Execute Alembic Database Migrations
        run: uv run alembic upgrade head

      - name: Seed Database Records
        run: uv run python -m scripts.seed

      - name: Execute Full Pytest Test Suite
        run: uv run pytest -v

      - name: Clean Up Seeded Records (Targeted Unseed)
        if: always()
        run: uv run python -m scripts.unseed --targeted

  frontend-check-and-build:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: "http://localhost:8000/api/v1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Build Next.js Application
        run: pnpm build

  integration-and-e2e-gate:
    name: Monorepo Integration & E2E Gate
    runs-on: ubuntu-latest
    needs:
      - backend-integration-tests
      - frontend-check-and-build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Monorepo Integration Status
        run: |
          echo "========================================================"
          echo "All Backend Integration Tests & Migrations Passed!"
          echo "Frontend Lint & Next.js Production Build Succeeded!"
          echo "Heketon Monorepo is fully verified and ready for deploy."
          echo "========================================================"

# ==============================================================================
# Heketon - AI Orchestrator Monorepo (Unified Docker Compose Template)
# Single unified container running Next.js 16 + FastAPI + LangGraph alongside PostgreSQL.
# Copy this file to `docker-compose.yml` and adjust environment variables:
#   cp docker-compose.example.yml docker-compose.yml
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 17 with pgvector extension (Local Database)
  # ----------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg17
    container_name: heketon-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-heketon}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-heketon}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - heketon-network

  # ----------------------------------------------------------------------------
  # Unified Application Container (Next.js 16 Frontend + FastAPI Backend)
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Heketon}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    container_name: heketon-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # Database connection inside Docker network
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/heketon}
      LANGGRAPH_CHECKPOINT_DB_URI: ${LANGGRAPH_CHECKPOINT_DB_URI:-postgresql://postgres:postgres@postgres:5432/heketon}
      RUN_MIGRATIONS: "true"
      # Application settings
      PROJECT_NAME: ${PROJECT_NAME:-Heketon API}
      API_V1_STR: ${API_V1_STR:-/api/v1}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key-in-production-use-openssl-rand-hex-32}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      # Internal routing
      INTERNAL_BACKEND_URL: "http://127.0.0.1:8000"
      # AI & LLM Providers
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_MODEL: ${ELEVENLABS_MODEL:-scribe_v1}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # LangSmith Observability
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-heketon-agent}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      # SMTP Gateway
      SMTP_ENABLED: ${SMTP_ENABLED:-true}
      SMTP_HOST: ${SMTP_HOST:-smtp.sumopod.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SSL: ${SMTP_SSL:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-notifications@smarthiring.ai}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-SmartHiring AI Orchestrator}
    volumes:
      - backend_storage:/app/backend/storage
    networks:
      - heketon-network

# ------------------------------------------------------------------------------
# Volumes & Networks
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    name: heketon_postgres_data
  backend_storage:
    name: heketon_backend_storage

networks:
  heketon-network:
    name: heketon-network
    driver: bridge
